<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The CODE-VERSE Wall</title>
  <meta name="description" content="Every card on this wall arrived as a pull request.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #FAF8F3;
      --grid: rgba(31, 33, 51, 0.065);
      --ink: #1F2133;
      --muted: #8B8FA8;
      --orange: #FF9500;
      --yellow: #FFE8A3;
      --pink: #FFCCD5;
      --green: #CDEBC0;
      --blue: #CFE5F7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
      background-color: var(--paper);
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 48px 48px;
    }
    header { max-width: 1240px; margin: 0 auto; padding: 56px 24px 16px; }
    .eyebrow {
      font-size: 13px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--muted); margin: 0 0 10px;
    }
    h1 {
      font-size: clamp(48px, 8vw, 96px); line-height: 0.95; margin: 0; font-weight: 800;
      letter-spacing: -0.03em;
    }
    .hl { position: relative; z-index: 0; white-space: nowrap; }
    .hl::before {
      content: ""; position: absolute; z-index: -1; left: -0.06em; right: -0.06em; bottom: 0.16em; height: 0.36em;
      background: rgba(255, 170, 60, 0.75); border-radius: 40% 60% 55% 45% / 60% 40% 60% 40%; transform: rotate(-1.5deg);
    }
    .tagline {
      font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-weight: 500;
      font-size: clamp(22px, 2.6vw, 32px); margin: 14px 0 0; color: #3A3D55;
    }
    .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 26px; }
    .live {
      display: inline-flex; align-items: center; gap: 10px; background: var(--ink); color: #fff;
      padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 15px;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #3FD07A; box-shadow: 0 0 0 0 rgba(63, 208, 122, .7); animation: pulse 1.8s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(63,208,122,.7); } 70% { box-shadow: 0 0 0 12px rgba(63,208,122,0); } 100% { box-shadow: 0 0 0 0 rgba(63,208,122,0); } }
    .chip {
      font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 13px; font-weight: 700;
      border: 2px solid var(--orange); color: #B36200; background: #FFF4E0; border-radius: 8px; padding: 6px 12px;
      text-decoration: none;
    }
    .status { font-size: 14px; color: var(--muted); }
    main { max-width: 1240px; margin: 0 auto; padding: 24px 24px 80px; }
    .wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 28px; }
    .card {
      position: relative; padding: 22px 22px 20px; min-height: 230px;
      box-shadow: 0 12px 24px rgba(31, 33, 51, 0.12), 0 2px 4px rgba(31, 33, 51, 0.06);
      transition: transform .25s ease;
    }
    .card:hover { transform: rotate(0deg) scale(1.03) !important; z-index: 2; }
    .card.c0 { background: var(--yellow); } .card.c1 { background: var(--pink); }
    .card.c2 { background: var(--green); } .card.c3 { background: var(--blue); }
    .card .top { display: flex; align-items: center; gap: 14px; }
    .avatar {
      width: 58px; height: 58px; border-radius: 50%; border: 3px solid #fff; background: #fff; object-fit: cover;
      display: grid; place-items: center; font-weight: 700; color: var(--ink); flex: none;
    }
    .emoji { margin-left: auto; font-size: 34px; line-height: 1; }
    .name { font-size: 21px; font-weight: 700; line-height: 1.15; margin: 14px 0 2px; overflow-wrap: anywhere; }
    .handle { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 13px; color: #4A4D66; text-decoration: none; }
    .handle:hover { text-decoration: underline; }
    .city { font-size: 13px; color: #4A4D66; margin-top: 4px; }
    .line { font-size: 15px; margin: 12px 0 0; line-height: 1.45; overflow-wrap: anywhere; }
    .fact {
      font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-weight: 600; font-size: 19px;
      margin: 10px 0 0; line-height: 1.3; color: #2E3046; overflow-wrap: anywhere;
    }
    .ribbon {
      position: absolute; top: -12px; right: 14px; background: var(--orange); color: #fff; font-weight: 700;
      font-size: 12px; letter-spacing: .08em; text-transform: uppercase; padding: 5px 10px; border-radius: 6px;
      box-shadow: 0 4px 10px rgba(255, 149, 0, .35);
    }
    .card.fresh { animation: pop .7s cubic-bezier(.2, 1.4, .4, 1) both; }
    @keyframes pop { from { opacity: 0; transform: scale(.4) rotate(-8deg); } }
    .empty { text-align: center; padding: 80px 20px; font-size: 20px; color: var(--muted); }
    .empty strong { display: block; font-size: 30px; color: var(--ink); margin-bottom: 8px; }
    footer { text-align: center; padding: 0 24px 48px; color: var(--muted); font-size: 14px; }
    footer a { color: var(--ink); font-weight: 600; }
    .confetti { position: fixed; top: -12px; width: 10px; height: 14px; z-index: 50; pointer-events: none; animation: fall linear forwards; }
    @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
    @media (max-width: 520px) { header { padding-top: 32px; } .wall { gap: 20px; } }
  </style>
</head>
<body>
  <header>
    <p class="eyebrow">CODE-VERSE · Git &amp; GitHub · hands-on session</p>
    <h1>the <span class="hl">wall.</span></h1>
    <p class="tagline">every card on this page arrived as a pull request.</p>
    <div class="bar">
      <span class="live"><span class="dot"></span><span id="count">loading the wall…</span></span>
      <a class="chip" id="repoLink" href="#" target="_blank" rel="noopener">how do I get on the wall? →</a>
      <span class="status" id="status"></span>
    </div>
  </header>

  <main>
    <section class="wall" id="wall" aria-live="polite"></section>
  </main>

  <footer>
    built live by a classroom of developers · <a id="footRepo" href="#" target="_blank" rel="noopener">see the code</a>
  </footer>

  <script>
    // ───────────────────────────────────────────────────────────────────
    // Settings. Leave owner/repo empty on GitHub Pages: they are read from
    // the URL (https://OWNER.github.io/REPO/). Fill them in only to test
    // this page somewhere else, or open it with ?repo=OWNER/REPO.
    // Add ?demo=1 to the URL to see the wall with sample cards.
    // ───────────────────────────────────────────────────────────────────
    const SETTINGS = { owner: "", repo: "", branch: "main", folder: "students", refreshSeconds: 20 };

    const wallEl = document.getElementById("wall");
    const countEl = document.getElementById("count");
    const statusEl = document.getElementById("status");
    const seen = new Map();      // file name -> rendered card element
    const cache = new Map();     // blob sha -> parsed card
    let firstLoad = true;
    const DEMO = new URLSearchParams(location.search).has("demo");

    const USERNAME_RE = /^[A-Za-z0-9](?:[A-Za-z0-9]|-(?=[A-Za-z0-9])){0,38}$/;
    const FIELDS = { name: 40, github: 39, city: 30, emoji: 12, tagline: 80, funFact: 140 };

    function detectRepo() {
      const q = new URLSearchParams(location.search);
      if (q.get("repo") && q.get("repo").includes("/")) {
        const [owner, repo] = q.get("repo").split("/");
        return { owner, repo };
      }
      if (SETTINGS.owner && SETTINGS.repo) return { owner: SETTINGS.owner, repo: SETTINGS.repo };
      const m = location.hostname.match(/^([A-Za-z0-9-]+)\.github\.io$/i);
      if (!m) return null;
      const first = location.pathname.split("/").filter(Boolean)[0];
      return { owner: m[1], repo: first || `${m[1]}.github.io` };
    }

    function cleanCard(raw, fileName) {
      if (!raw || typeof raw !== "object" || Array.isArray(raw)) return null;
      const card = {};
      for (const [key, max] of Object.entries(FIELDS)) {
        const value = typeof raw[key] === "string" ? raw[key].trim() : "";
        if (!value) return null;
        card[key] = value.slice(0, max);
      }
      if (!USERNAME_RE.test(card.github)) return null;
      card.file = fileName;
      return card;
    }

    function hash(text) {
      let h = 0;
      for (const ch of text.toLowerCase()) h = (h * 31 + ch.codePointAt(0)) >>> 0;
      return h;
    }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function buildCard(card, fresh) {
      const h = hash(card.github);
      const node = el("article", `card c${h % 4}` + (fresh ? " fresh" : ""));
      node.style.transform = `rotate(${((h % 7) - 3) * 0.6}deg)`;

      const top = el("div", "top");
      const initials = () => el("div", "avatar", card.name.split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase());
      if (DEMO) {
        top.append(initials());               // demo cards are fictional: no real avatars
      } else {
        const img = el("img", "avatar");
        img.alt = "";
        img.loading = "lazy";
        img.src = `https://github.com/${encodeURIComponent(card.github)}.png?size=120`;
        img.onerror = () => img.replaceWith(initials());
        top.append(img);
      }
      top.append(el("div", "emoji", card.emoji));
      node.append(top);

      node.append(el("div", "name", card.name));
      const handle = el("a", "handle", "@" + card.github);
      handle.href = `https://github.com/${encodeURIComponent(card.github)}`;
      handle.target = "_blank";
      handle.rel = "noopener";
      node.append(handle);
      node.append(el("div", "city", "📍 " + card.city));
      node.append(el("p", "line", card.tagline));
      node.append(el("p", "fact", "“" + card.funFact + "”"));
      if (fresh) node.append(el("span", "ribbon", "just merged ✨"));
      return node;
    }

    function updateCount() {
      const n = seen.size;
      countEl.textContent = n === 1 ? "1 developer has shipped to this wall" : `${n} developers have shipped to this wall`;
      if (n === 0 && !wallEl.querySelector(".empty")) {
        const empty = el("div", "empty");
        empty.append(el("strong", "", "the wall is empty… for now 👀"));
        empty.append(document.createTextNode("the first merged pull request lands here."));
        wallEl.append(empty);
      }
      if (n > 0) wallEl.querySelector(".empty")?.remove();
    }

    function confetti() {
      const colors = ["#FF9500", "#FFE8A3", "#FFCCD5", "#CDEBC0", "#CFE5F7", "#8957E5", "#3FD07A"];
      for (let i = 0; i < 90; i++) {
        const piece = el("div", "confetti");
        piece.style.left = Math.random() * 100 + "vw";
        piece.style.background = colors[i % colors.length];
        piece.style.animationDuration = 2 + Math.random() * 2.5 + "s";
        piece.style.animationDelay = Math.random() * 0.6 + "s";
        piece.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";
        document.body.append(piece);
        setTimeout(() => piece.remove(), 5500);
      }
    }

    function show(cards) {
      const incoming = new Set(cards.map(c => c.file));
      for (const [file, node] of seen) {
        if (!incoming.has(file)) { node.remove(); seen.delete(file); }
      }
      let added = 0;
      const sorted = [...cards].sort((a, b) => a.name.localeCompare(b.name));
      for (const card of sorted) {
        if (seen.has(card.file)) continue;
        const fresh = !firstLoad;
        const node = buildCard(card, fresh);
        if (fresh) wallEl.prepend(node); else wallEl.append(node);
        seen.set(card.file, node);
        added++;
      }
      if (added && !firstLoad) confetti();
      firstLoad = false;
      updateCount();
    }

    async function loadFromGitHub(target) {
      const url = `https://api.github.com/repos/${target.owner}/${target.repo}/contents/${SETTINGS.folder}?ref=${SETTINGS.branch}`;
      const res = await fetch(url, { cache: "no-cache" });
      if (res.status === 404) return [];
      if (res.status === 403 || res.status === 429) {
        const reset = Number(res.headers.get("x-ratelimit-reset")) * 1000;
        const wait = reset ? Math.max(30, Math.round((reset - Date.now()) / 1000)) : 60;
        const err = new Error("rate limited");
        err.retryIn = wait;
        throw err;
      }
      if (!res.ok) throw new Error(`GitHub said ${res.status}`);
      const files = (await res.json()).filter(f => f.type === "file" && f.name.endsWith(".json") && !f.name.startsWith("_"));
      const cards = await Promise.all(files.map(async f => {
        if (cache.has(f.sha)) return cache.get(f.sha);
        try {
          const r = await fetch(`${f.download_url}?v=${f.sha}`);
          const card = cleanCard(await r.json(), f.name);
          if (card) cache.set(f.sha, card);
          return card;
        } catch (e) {
          console.warn(`Skipping ${f.name}: it is not valid JSON yet.`);
          return null;
        }
      }));
      return cards.filter(Boolean);
    }

    const SAMPLE = [
      { name: "Aarav Mehta", github: "aarav-builds", city: "Pune", emoji: "🚀", tagline: "2nd year CSE · learning web dev", funFact: "I debug better after cutting chai" },
      { name: "Sana Shaikh", github: "sana-codes", city: "Mumbai", emoji: "🎧", tagline: "IT student · loves UI design", funFact: "I have 400+ songs in one playlist" },
      { name: "Rohan Kulkarni", github: "rohan-k-dev", city: "Nashik", emoji: "🏏", tagline: "future backend engineer", funFact: "I once fixed a bug in my sleep. Literally." },
      { name: "Priya Nair", github: "priya-ships", city: "Kochi", emoji: "🌱", tagline: "ECE · curious about ML", funFact: "I can name every Pokémon from Gen 1" },
      { name: "Kabir Singh", github: "kabir-commits", city: "Nagpur", emoji: "⚡", tagline: "first-year · first PR today", funFact: "my first commit message was 'final final'" },
      { name: "Meera Iyer", github: "meera-merges", city: "Bengaluru", emoji: "🎨", tagline: "design + code = ❤️", funFact: "I sketch every app before I build it" },
      { name: "Dev Patil", github: "dev-patil-x", city: "Kolhapur", emoji: "🧠", tagline: "DSA grinder · 300 problems", funFact: "I explain recursion using Russian dolls" },
      { name: "Ananya Rao", github: "ananya-pushes", city: "Hyderabad", emoji: "☕", tagline: "full-stack in progress", funFact: "I name my variables after my cats" }
    ];

    function runDemo() {
      statusEl.textContent = "demo mode · sample cards";
      document.getElementById("repoLink").href = "#";
      const wave = SAMPLE.slice(0, 5).map(c => ({ ...c, file: c.github + ".json" }));
      show(wave);
      let i = 5;
      const timer = setInterval(() => {
        if (i >= SAMPLE.length) return clearInterval(timer);
        wave.push({ ...SAMPLE[i], file: SAMPLE[i].github + ".json" });
        i++;
        show(wave);
      }, 4000);
    }

    async function start() {
      if (DEMO) return runDemo();
      const target = detectRepo();
      if (!target) {
        countEl.textContent = "open this page on GitHub Pages (or add ?demo=1)";
        return;
      }
      const repoUrl = `https://github.com/${target.owner}/${target.repo}`;
      document.getElementById("repoLink").href = `${repoUrl}#readme`;
      document.getElementById("footRepo").href = repoUrl;

      const tick = async () => {
        let next = SETTINGS.refreshSeconds;
        try {
          show(await loadFromGitHub(target));
          statusEl.textContent = "updated " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
        } catch (e) {
          if (e.retryIn) {
            next = e.retryIn;
            statusEl.textContent = `GitHub asked us to slow down. Trying again in ${Math.ceil(next / 60)} min.`;
          } else {
            statusEl.textContent = "couldn't reach GitHub. retrying…";
          }
          if (firstLoad) countEl.textContent = "waiting for GitHub…";
        }
        setTimeout(tick, next * 1000);
      };
      tick();
    }

    start();
  </script>
</body>
</html>
