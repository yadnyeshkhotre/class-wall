name: Check student cards

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate-cards:
    name: validate-cards
    runs-on: ubuntu-latest
    steps:
      - name: Get the code from this pull request
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check every card this pull request adds or changes
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: python3 .github/scripts/validate_cards.py
