<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hi, I'm Your Name</title>
  <style>
    /* 🎨 THEME: change these colours */
    :root {
      --bg: #FAF8F3;
      --ink: #1F2133;
      --accent: #FF9500;
    }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background-color: var(--bg); color: var(--ink);
      background-image: linear-gradient(rgba(127,127,127,.15) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(127,127,127,.15) 1px, transparent 1px);
      background-size: 40px 40px;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    main { max-width: 640px; padding: 40px 24px; }
    .hello { color: var(--accent); font-weight: 700; letter-spacing: .15em; text-transform: uppercase; }
    h1 { font-size: 56px; line-height: 1.05; margin: 8px 0; }
    .tagline { font-size: 22px; font-style: italic; opacity: .85; }
    .note { background: #FFE8A3; color: #1F2133; padding: 20px 24px; margin: 28px 0;
            transform: rotate(-1.5deg); box-shadow: 0 10px 22px rgba(0,0,0,.15); }
    .skills span { display: inline-block; border: 2px solid var(--accent); border-radius: 999px;
                   padding: 4px 14px; margin: 4px 4px 0 0; font-weight: 600; }
    a { color: var(--accent); font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <p class="hello">👋 hello, world</p>
    <h1>I'm Your Name</h1>
    <p class="tagline">Engineering student · future software engineer</p>
    <div class="note">
      <strong>About me:</strong> I'm learning to build things with code.
      This page is my first website, shipped with Git and GitHub.
    </div>
    <p class="skills"><span>HTML</span><span>Git</span><span>GitHub</span></p>
    <p>Find me on <a href="https://github.com/your-username">GitHub</a></p>
  </main>
</body>
</html>
